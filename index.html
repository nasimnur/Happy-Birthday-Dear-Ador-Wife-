<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>শুভ জন্মদিন Hasina! ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            padding: 20px;
        }

        /* Floating Hearts Animation Background */
        .heart-bg {
            position: absolute;
            color: rgba(255, 255, 255, 0.7);
            animation: floatUp 5s linear infinite;
            font-size: 20px;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5); opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }

        /* Envelope Screen */
        .envelope-container {
            text-align: center;
            cursor: pointer;
            z-index: 10;
        }

        .envelope {
            width: 290px;
            padding: 30px 20px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.25);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            border: 3px solid #ff4b2b;
            transition: transform 0.3s;
        }

        .envelope:hover {
            transform: scale(1.05);
        }

        .envelope-icon {
            font-size: 65px;
            margin-bottom: 15px;
            animation: bounce 1.5s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .envelope p {
            color: #ff4b2b;
            font-weight: bold;
            font-size: 17px;
            margin-bottom: 5px;
        }

        /* Main Gift Card */
        .card-container {
            display: none;
            width: 100%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            padding: 30px 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            text-align: center;
            animation: openCard 0.6s ease-in-out forwards;
            z-index: 10;
        }

        @keyframes openCard {
            from { opacity: 0; transform: scale(0.7); }
            to { opacity: 1; transform: scale(1); }
        }

        .heart-beat {
            font-size: 55px;
            animation: beat 0.8s infinite alternate;
        }

        @keyframes beat {
            to { transform: scale(1.25); }
        }

        h1 {
            color: #d63031;
            font-size: 26px;
            margin: 15px 0 10px;
        }

        .subtitle {
            color: #666;
            font-size: 15px;
            margin-bottom: 20px;
        }

        /* Dynamic Message Box */
        .msg-box {
            background: #fff0f3;
            border-left: 5px solid #ff4b2b;
            padding: 18px;
            border-radius: 12px;
            color: #2d3436;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 25px;
            min-height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 10px rgba(255,182,193,0.3);
        }

        .btn {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 75, 43, 0.4);
            transition: 0.3s;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(255, 75, 43, 0.6);
        }

        .step-counter {
            margin-top: 15px;
            font-size: 13px;
            color: #888;
        }
    </style>
</head>
<body>

    <!-- Background Music -->
    <audio id="bgMusic" loop preload="auto">
        <source src="https://assets.mixkit.co/music/preview/mixkit-happy-times-158.mp3" type="audio/mpeg">
    </audio>

    <!-- Floating Hearts Background -->
    <div id="heartsContainer"></div>

    <!-- ১. উপহারের খাম স্ক্রিন -->
    <div class="envelope-container" id="envelopeScreen" onclick="openGift()">
        <div class="envelope">
            <div class="envelope-icon">💌</div>
            <p>Hasina-এর জন্য বিশেষ উপহার 🎁</p>
            <span style="font-size:12px; color:#888; margin-top:5px;">(খুলতে এখানে চাপ দাও)</span>
        </div>
    </div>

    <!-- ২. মূল বার্থডে কার্ড -->
    <div class="card-container" id="cardScreen">
        <div class="heart-beat">💖</div>
        <h1>শুভ জন্মদিন, Hasina! 🎂</h1>
        <p class="subtitle">আমার জীবনের সবচেয়ে প্রিয় মানুষটি তুমি ✨</p>

        <!-- ভালোবাসার মেসেজ বক্স -->
        <div class="msg-box" id="msgText">
            ❤️ তোমার জন্মদিন কেবল তোমার আনন্দের দিন নয়, আমার কাছে তোমাকে পাওয়ার বিশেষ একটি দিন!
        </div>

        <button class="btn" id="nextBtn" onclick="nextMessage()">পরের বার্তাটি দেখ 💌</button>
        <div class="step-counter" id="stepText">বার্তা ১ / ৪</div>
    </div>

    <!-- Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script>
        const messages = [
            "❤️ তোমার জন্মদিন কেবল তোমার আনন্দের দিন নয়, আমার কাছে তোমাকে পাওয়ার বিশেষ একটি দিন!",
            "🌸 তোমার প্রতিটি সুন্দর হাসি আমার পুরো দিনকে আলোতে ভরিয়ে দেয়। সারাজীবন এভাবেই পাশে থেকো।",
            "✨ জীবনের সব চাওয়া-পাওয়া পূর্ণ হোক তোমার। সব কষ্ট দূরে গিয়ে তোমার পথ ভালোবাসায় ভরে উঠুক।",
            "💍 আজ তোমার জন্মদিনে শুধু এটুকুই বলব— আমি তোমাকে প্রতিটি মুহূর্তে অনেক ভালোবাসি! শুভ জন্মদিন আমার হাসিনা 💖🎉"
        ];

        let currentStep = 0;

        // Floating Hearts Generator
        function createHearts() {
            const container = document.getElementById('heartsContainer');
            for (let i = 0; i < 15; i++) {
                const heart = document.createElement('div');
                heart.classList.add('heart-bg');
                heart.innerHTML = '❤️';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
                heart.style.fontSize = (Math.random() * 15 + 15) + 'px';
                container.appendChild(heart);
            }
        }
        createHearts();

        function openGift() {
            // খাম লুকিয়ে কার্ড দেখানো
            document.getElementById('envelopeScreen').style.display = 'none';
            document.getElementById('cardScreen').style.display = 'block';
            
            // ব্যাকগ্রাউন্ড মিউজিক প্লে করা
            const audio = document.getElementById('bgMusic');
            if (audio) {
                audio.play().catch(function(error) {
                    console.log("Audio play failed:", error);
                });
            }

            // কনফেটি কালারফুল অ্যানিমেশন
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            }
        }

        function nextMessage() {
            currentStep++;
            
            if (currentStep < messages.length) {
                document.getElementById('msgText').innerHTML = messages[currentStep];
                document.getElementById('stepText').innerText = `বার্তা ${currentStep + 1} /${messages.length}`;
                
                if (typeof confetti === 'function') {
                    confetti({
                        particleCount: 50,
                        spread: 60,
                        origin: { y: 0.7 }
                    });
                }

                if(currentStep === messages.length - 1) {
                    document.getElementById('nextBtn').innerText = "আবার শুরু থেকে দেখ 🔄";
                }
            } else {
                currentStep = 0;
                document.getElementById('msgText').innerHTML = messages[currentStep];
                document.getElementById('stepText').innerText = `বার্তা ${currentStep + 1} /${messages.length}`;
                document.getElementById('nextBtn').innerText = "পরের বার্তাটি দেখ 💌";
            }
        }
    </script>
</body>
</html>
